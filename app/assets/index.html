<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F0EEE6">
<title>AragonTask</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
        <g stroke="#CC785C" stroke-width="2.1" stroke-linecap="round" fill="none">
          <line x1="12" y1="2.6" x2="12" y2="21.4"/>
          <line x1="2.6" y1="12" x2="21.4" y2="12"/>
          <line x1="5.4" y1="5.4" x2="18.6" y2="18.6"/>
          <line x1="18.6" y1="5.4" x2="5.4" y2="18.6"/>
        </g>
      </svg>
      <span class="wordmark">AragonTask</span>
    </div>
    <div class="date">
      <div class="d1" id="hd-date"></div>
      <div class="d2" id="hd-hi"></div>
    </div>
  </header>

  <!-- ================= HUB ================= -->
  <div id="view-hub">
    <button class="hub-hero card" data-act="view" data-id="agent">
      <div class="hh-ic">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g stroke="#CC785C" stroke-width="2.1" stroke-linecap="round" fill="none">
            <line x1="12" y1="2.6" x2="12" y2="21.4"/>
            <line x1="2.6" y1="12" x2="21.4" y2="12"/>
            <line x1="5.4" y1="5.4" x2="18.6" y2="18.6"/>
            <line x1="18.6" y1="5.4" x2="5.4" y2="18.6"/>
          </g>
        </svg>
      </div>
      <div class="hh-t">
        <b>Aragon 智能体</b>
        <p>对话即可增删改查待办、备忘与账本，还能联网检索资料</p>
      </div>
      <svg class="hh-go" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="hub-grid">
      <button class="hub-c card" data-act="view" data-id="todo">
        <div class="hc-ic" style="--c:#CC785C">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.7"/><path d="M6.8 10.2l2.2 2.2 4.2-4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <b>待办任务</b>
        <span id="hub-todo">…</span>
      </button>
      <button class="hub-c card" data-act="view" data-id="money">
        <div class="hc-ic" style="--c:#C5A463">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.7"/><path d="M7 7l6 6M13 7l-6 6M8 7h4M8 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <b>记账本</b>
        <span id="hub-money">…</span>
      </button>
      <button class="hub-c card" data-act="view" data-id="memo">
        <div class="hc-ic" style="--c:#7C9885">
          <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="3.2" width="12" height="13.6" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M7.2 7.5h5.6M7.2 10.5h5.6M7.2 13.5h3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <b>备忘录</b>
        <span id="hub-memo">…</span>
      </button>
      <button class="hub-c card" data-act="view" data-id="agent2">
        <div class="hc-ic" style="--c:#7D93A8">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2M4.8 4.8l1.5 1.5M13.7 13.7l1.5 1.5M15.2 4.8l-1.5 1.5M6.3 13.7l-1.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <b>AI 配置</b>
        <span>模型与凭证</span>
      </button>
    </div>

    <div class="hub-foot">试试对智能体说：「帮我记一笔午饭 25 元」或「查一下明天杭州天气」</div>
  </div>

  <!-- ================= TODO VIEW ================= -->
  <div id="view-todo" hidden>
    <div class="view-head">
      <button class="icon-btn back" data-act="home" aria-label="返回">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <b>待办任务</b>
    </div>

    <div class="qa card">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="qa-in" placeholder="快速添加任务，回车保存" maxlength="120" autocomplete="off">
      <button class="qa-chip" id="qa-today" aria-label="默认记到今天">今天</button>
    </div>

    <section class="hero card">
      <svg class="ring" viewBox="0 0 62 62" aria-hidden="true">
        <circle class="ring-bg" cx="31" cy="31" r="26"/>
        <circle class="ring-fg" cx="31" cy="31" r="26" id="ring"/>
      </svg>
      <div class="hero-t">
        <div class="ht-label">今日进度</div>
        <div class="ht-num"><span id="hero-done">0</span><span class="ht-sep"> / </span><span id="hero-all">0</span></div>
        <div class="ht-sub" id="hero-sub"></div>
      </div>
    </section>

    <nav class="chips" id="chips"></nav>

    <div class="sec"><span>待办</span><span class="cnt" id="todo-cnt"></span><i class="ln"></i></div>
    <div class="list card" id="list"></div>

    <div class="empty" id="empty" hidden>
      <h3 id="empty-t">一切安好</h3>
      <p id="empty-p"></p>
      <button class="empty-cta" id="empty-cta">添加第一个任务</button>
    </div>

    <div class="sec sec-btn-wrap">
      <button class="sec-btn" id="done-toggle">
        <span>已完成</span><span class="cnt" id="done-cnt"></span>
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <i class="ln"></i>
    </div>
    <div class="list card" id="donelist" hidden></div>
  </div>

  <!-- ================= MONEY VIEW ================= -->
  <div id="view-money" hidden>
    <div class="view-head">
      <button class="icon-btn back" data-act="home" aria-label="返回">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <b>记账本</b>
    </div>

    <section class="hero card m-hero">
      <div class="mh-main">
        <div class="ht-label" id="m-lb">本月支出</div>
        <div class="mh-num"><span id="m-out">0</span><span class="mh-cur">元</span></div>
        <div class="ht-sub" id="m-sub"></div>
      </div>
      <button class="reimb-chip" id="reimb-chip" data-act="mreimb">
        <span class="rc-l">待报销</span>
        <span class="rc-v" id="reimb-sum">¥0</span>
      </button>
    </section>

    <div class="m-nav">
      <button id="m-prev" data-act="mprev" aria-label="上月">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="m-month" id="m-month"></div>
      <button id="m-next" data-act="mnext" aria-label="下月">
        <svg viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="chips" id="m-chips"></nav>

    <div class="empty" id="m-empty" hidden>
      <h3 id="m-empty-t">还没有账目</h3>
      <p id="m-empty-p">记下第一笔，看看钱都去哪儿了。</p>
      <button class="empty-cta" id="m-empty-cta">记第一笔</button>
    </div>

    <div id="m-groups"></div>
  </div>

  <!-- ================= MEMO VIEW ================= -->
  <div id="view-memo" hidden>
    <div class="view-head">
      <button class="icon-btn back" data-act="home" aria-label="返回">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <b>备忘录</b>
      <button class="icon-btn mh-add" data-act="madd" aria-label="手动添加" style="margin-left:auto">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="memo-view-list"></div>
  </div>

  <!-- ================= AGENT VIEW ================= -->
  <div id="view-agent" hidden>
    <div class="view-head">
      <button class="icon-btn back" data-act="home" aria-label="返回">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <b>Aragon 智能体</b>
      <div class="mt-acts" style="margin-left:auto">
        <button class="icon-btn" data-act="aicfg" aria-label="AI 配置">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" data-act="clearchat" aria-label="清空对话">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="chat-wrap">
      <div class="chat-scroll" id="chat"></div>
      <div class="composer">
        <textarea id="chat-in" placeholder="让智能体记事、记账、查资料…" maxlength="500" rows="1" autocomplete="off"></textarea>
        <button class="send-b" id="chat-send" aria-label="发送">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 16V4M5 9l5-5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="spacer" id="spacer"></div>
  <footer>AragonTask · 数据仅存本机</footer>

  <button class="fab" id="fab" aria-label="新增">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <span id="fab-t">新任务</span>
  </button>
</div>

<div class="scrim" id="scrim"></div>

<!-- task sheet -->
<section class="sheet" id="task-sheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 class="sh" id="ts-h">新任务</h2>
  <input class="t-title" id="ts-title" placeholder="想做点什么？" maxlength="60" autocomplete="off">
  <textarea class="t-note" id="ts-note" rows="2" placeholder="备注，可选"></textarea>
  <div class="lb">分类</div>
  <div class="chips-in" id="ts-cats"></div>
  <div class="lb">日期</div>
  <div class="chips-in" id="ts-dates"></div>
  <input type="date" id="ts-date-input" class="dpick" tabindex="-1">
  <button class="save" id="ts-save" disabled>保存</button>
  <button class="ghost-del" id="ts-del" hidden>删除此任务</button>
</section>

<!-- record sheet -->
<section class="sheet" id="rec-sheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 class="sh" id="rs-h">记一笔</h2>
  <div class="type-seg" id="rs-type">
    <button class="ts-b on" data-act="rtype" data-id="out">支出</button>
    <button class="ts-b" data-act="rtype" data-id="in">收入</button>
  </div>
  <div class="amt-row">
    <span class="amt-cur">¥</span>
    <input id="rs-amt" inputmode="decimal" placeholder="0.00" maxlength="12" autocomplete="off">
  </div>
  <input class="t-title" id="rs-title" placeholder="买什么了？可选" maxlength="30" autocomplete="off">
  <div id="rs-catwrap">
    <div class="lb">分类</div>
    <div class="chips-in" id="rs-cats"></div>
  </div>
  <div class="lb">日期</div>
  <div class="chips-in" id="rs-dates"></div>
  <div class="chips-in" style="margin-top:2px">
    <input type="date" id="rs-date-input" class="dpick" tabindex="-1">
  </div>
  <label class="sw-row" id="rs-reimbrow">
    <span>这笔需要报销</span>
    <input type="checkbox" id="rs-reimb"><i class="tgl"></i>
  </label>
  <button class="save" id="rs-save" disabled>保存</button>
  <button class="ghost-del" id="rs-del" hidden>删除此记录</button>
</section>

<!-- manual memo sheet -->
<section class="sheet" id="mm-sheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 class="sh">记一条备忘</h2>
  <input class="t-title" id="mm-title" placeholder="备忘标题" maxlength="40" autocomplete="off">
  <textarea class="t-note" id="mm-note" rows="2" placeholder="补充内容，可选"></textarea>
  <input class="f-in" id="mm-cat" placeholder="分类，留空为未分类" maxlength="8" autocomplete="off">
  <button class="save" id="mm-save" disabled>保存</button>
</section>

<!-- AI config sheet -->
<section class="sheet" id="ai-sheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 class="sh">AI 配置</h2>
  <div class="cat-list" id="ai-list"></div>
  <div class="lb" id="ai-lb">新增配置</div>
  <input class="f-in" id="ai-name" placeholder="配置名称，如 我的 OpenAI" maxlength="20" autocomplete="off">
  <div class="type-seg" id="ai-style" style="margin-top:12px">
    <button class="ts-b on" data-act="aistyle" data-id="openai">OpenAI</button>
    <button class="ts-b" data-act="aistyle" data-id="anthropic">Anthropic</button>
    <button class="ts-b" data-act="aistyle" data-id="custom">自定义</button>
  </div>
  <input class="f-in" id="ai-url" placeholder="API 地址" autocomplete="off" inputmode="url">
  <div class="key-row">
    <input class="f-in" id="ai-key" type="password" placeholder="API Key（凭证）" autocomplete="off">
    <button class="eye" id="ai-eye" aria-label="显示密钥">
      <svg viewBox="0 0 20 20" fill="none"><path d="M2.5 10S5.8 4.8 10 4.8 17.5 10 17.5 10 14.2 15.2 10 15.2 2.5 10 2.5 10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div class="lb">模型</div>
  <div class="model-row">
    <input class="f-in" id="ai-model" placeholder="模型名" autocomplete="off" style="flex:1">
    <button class="mini-btn" data-act="aifetch">获取列表</button>
  </div>
  <div class="chips-in" id="ai-models"></div>
  <input class="f-in" id="ai-headers" placeholder='额外请求头 JSON，可选' autocomplete="off">
  <button class="save" id="ai-save" disabled>保存配置</button>
  <div class="ai-acts">
    <button class="ghost-def" id="ai-def" hidden>设为默认</button>
    <button class="ghost-del" id="ai-del" hidden style="width:100%">删除此配置</button>
  </div>
  <div class="cs-tip">配置保存在本机，仅在请求你填写的地址时使用。</div>
</section>

<!-- category sheet -->
<section class="sheet" id="cat-sheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 class="sh">分类管理</h2>
  <div class="cat-list" id="cs-list"></div>
  <div class="lb" id="cs-lb">新建分类</div>
  <input class="cs-name" id="cs-name" placeholder="分类名称" maxlength="8" autocomplete="off">
  <div class="swatches" id="cs-swatches"></div>
  <button class="save" id="cs-save" disabled>添加</button>
  <button class="ghost-del" id="cs-del" hidden>删除此分类</button>
  <div class="cs-tip" id="cs-tip">删除分类后，其中的任务会归入「未分类」</div>
</section>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-un" hidden>撤销</button></div>

<script src="./app.js"></script>
</body>
</html>
